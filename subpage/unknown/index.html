<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杂碎知识</title>
    <style>
        /* 引入指定路径的字体文件 */
        @font-face {
            font-family: 'LD-MONG-HWT';
            src: url('../../fonts/LD-MONG-HWT.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* 90年代风格CSS */
        body {
            background-color: #c0c0c0;
            font-family: 'LD-MONG-HWT', "Times New Roman", serif;
            margin: 10px;
            padding: 0;
            color: #000;
            font-size: 16px;
        }
        
        .container {
            width: 95%;
            max-width: 1000px; /* 适当加宽容器以容纳竖排列 */
            margin: 0 auto;
            background-color: #fff;
            border: 2px outset #c0c0c0;
            padding: 15px;
            box-sizing: border-box;
        }

        /* 刷新提示框样式 */
        .refresh-alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            max-width: 90%;
            border: 1px solid #003C74;
            background-color: #fff;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.4);
            z-index: 9999;
            display: none;
        }
        .alert-titlebar {
            height: 24px;
            background: linear-gradient(to right, #0054E3, #0078D7);
            padding: 0 10px;
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            font-family: 'LD-MONG-HWT', sans-serif;
        }
        .alert-content {
            padding: 15px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            font-family: 'LD-MONG-HWT', serif;
        }
        .alert-btn-group {
            display: flex;
            justify-content: flex-end;
            padding: 10px 15px;
            border-top: 1px solid #c0c0c0;
            background-color: #e8e8e8;
        }
        .alert-btn {
            background-color: #c0c0c0;
            border: 2px outset #c0c0c0;
            padding: 4px 12px;
            margin-left: 8px;
            cursor: pointer;
            font-family: 'LD-MONG-HWT', serif;
            font-size: 13px;
        }
        .alert-btn:active {
            border: 2px inset #c0c0c0;
        }

        /* 顶部操作区：垂直布局 */
        .top-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* 返回按钮样式 */
        .back-btn {
            background-color: #c0c0c0;
            border: 2px outset #c0c0c0;
            padding: 8px 15px;
            cursor: pointer;
            font-family: 'LD-MONG-HWT', serif;
            font-size: 16px;
            color: #000;
            text-decoration: none;
            display: inline-block;
            width: fit-content;
        }

        .back-btn:hover {
            background-color: #d0d0d0;
        }

        .back-btn:active {
            border: 2px inset #c0c0c0;
        }

        /* 搜索框样式 - 垂直布局优化 */
        .search-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .search-label {
            font-size: 16px;
            font-weight: bold;
            font-family: 'LD-MONG-HWT', serif;
        }

        .search-input {
            width: 100%;
            padding: 8px;
            border: 2px inset #c0c0c0;
            background-color: #fff;
            font-family: 'LD-MONG-HWT', serif;
            font-size: 16px;
            box-sizing: border-box;
        }

        .search-btn-group {
            display: flex;
            gap: 10px;
        }

        .search-btn {
            background-color: #c0c0c0;
            border: 2px outset #c0c0c0;
            padding: 8px 15px;
            cursor: pointer;
            font-family: 'LD-MONG-HWT', serif;
            font-size: 16px;
            flex: 1;
        }

        .search-btn:active {
            border: 2px inset #c0c0c0;
        }

        /* 搜索结果提示 */
        .search-result {
            font-size: 16px;
            margin: 10px 0;
            color: #000080;
            font-style: italic;
            font-family: 'LD-MONG-HWT', serif;
        }
        
        h1 {
            font-size: 28px;
            margin: 0 0 20px 0;
            font-weight: bold;
            color: #000080;
            text-align: center;
            font-family: 'LD-MONG-HWT', serif;
        }
        
        /* 表格容器：垂直布局优化 */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #808080;
        }
        
        table {
            width: 100%;
            min-width: 800px; /* 增加表格最小宽度以容纳竖排列 */
            border-collapse: collapse;
            font-size: 16px;
            font-family: 'LD-MONG-HWT', serif;
        }
        
        th, td {
            border: 1px solid #000;
            padding: 8px 10px;
            text-align: left;
        }
        
        th {
            background-color: #008080;
            color: #fff;
            font-weight: bold;
            font-size: 17px;
        }
        


        /* 无数据提示 */
        .no-data {
            text-align: center;
            padding: 20px;
            color: #ff0000;
            font-size: 16px;
            font-family: 'LD-MONG-HWT', serif;
        }
        
        .status {
            background-color: #e8e8e8;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px inset #c0c0c0;
            font-size: 16px;
            font-family: 'LD-MONG-HWT', serif;
        }
        
        .loading {
            color: #000080;
        }
        
        .error {
            color: #ff0000;
        }
        
        .success {
            color: #008000;
        }
        
        .github-info {
            background-color: #e8e8e8;
            padding: 15px;
            margin-top: 25px;
            border: 2px inset #c0c0c0;
            font-size: 16px;
            font-family: 'LD-MONG-HWT', serif;
        }
        
        .github-info h2 {
            margin-top: 0;
            font-size: 20px;
            color: #000080;
        }
        
        .blink {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .container {
                max-width: 95%;
            }
            
            /* 竖排列在小屏幕上适当缩小 */
            th:nth-child(3),
            td:nth-child(3) {
                font-size: 24px;
                min-width: 60px;
            }

            .top-actions {
                gap: 12px;
            }

            .back-btn, .search-btn, .alert-btn {
                padding: 6px 12px;
                font-size: 15px;
            }

            .search-input {
                padding: 6px;
                font-size: 15px;
            }

            h1 {
                font-size: 24px;
            }

            th, td {
                padding: 6px;
                font-size: 15px;
            }

            .github-info {
                padding: 12px;
                font-size: 15px;
            }

            .alert-content {
                font-size: 14px;
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                margin: 5px;
            }

            .container {
                padding: 10px;
                width: 98%;
            }

            .search-btn-group {
                flex-direction: column;
            }

            /* 超小屏幕上进一步调整竖排列 */
            th:nth-child(3),
            td:nth-child(3) {
                font-size: 20px;
                min-width: 50px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 15px;
            }

            .status {
                font-size: 14px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <!-- 刷新提示框 -->
    <div class="refresh-alert" id="refreshAlert">
        <div class="alert-titlebar">提示信息</div>
        <div class="alert-content">
            请刷新网页以获得最新的网页，否则在某些设备上只有缓存的网页
        </div>
        <div class="alert-btn-group">
            <button class="alert-btn" id="doRefresh">立即刷新</button>
            <button class="alert-btn" id="closeAlert">稍后再说</button>
        </div>
    </div>

    <div class="container">
        <!-- 顶部操作区：垂直布局 -->
        <div class="top-actions">
            <a href="../../index.html" class="back-btn">← 返回首页</a>
            
            <div class="search-container">
                <span class="search-label">搜索知识：</span>
                <input type="text" id="searchInput" class="search-input" placeholder="输入关键词搜索主题、类别或描述...">
                <div class="search-btn-group">
                    <button id="searchBtn" class="search-btn">搜索</button>
                    <button id="clearBtn" class="search-btn">清除搜索</button>
                </div>
            </div>
        </div>

        <!-- 搜索结果提示 -->
        <div id="searchResult" class="search-result" style="display: none;"></div>
        
        <h1>杂碎知识</h1>
        
        <!-- 数据加载状态 -->
        <div id="status" class="status">
            正在加载数据...
        </div>
        
        <!-- 表格容器 -->
        <div class="table-container">
            <table id="knowledgeTable">
                <thead>
                    <tr>
                        <th>编号</th>
                        <th>汉字</th>
                        <th>蒙古文</th>
                        <th>发音</th>
                        <th>备注</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 数据将通过JavaScript动态添加 -->
                </tbody>
            </table>
        </div>
        
        <!-- 网站说明 -->
        <div class="github-info">
            <h2>关于此网站</h2>
            <p>这个网站托管在 GitHub Pages 上，展示个人知识库数据。</p>
            <p class="blink">提示: 支持搜索主题、类别、描述，表格内容可横向滑动查看完整信息。</p>
        </div>
    </div>

    <script>
        let fullData = [];
        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const searchResult = document.getElementById('searchResult');

        // 刷新提示框控制逻辑
        function initRefreshAlert() {
            const refreshAlert = document.getElementById('refreshAlert');
            const doRefreshBtn = document.getElementById('doRefresh');
            const closeAlertBtn = document.getElementById('closeAlert');

            refreshAlert.style.display = 'block';

            doRefreshBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                window.location.reload(true);
            });

            closeAlertBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                refreshAlert.style.display = 'none';
            });
        }

        // 加载数据
        async function loadData() {
            const statusElement = document.getElementById('status');
            
            try {
                statusElement.textContent = "正在从根目录加载data.json文件...";
                statusElement.className = "status loading";
                
                const response = await fetch('./data.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态: ${response.status}`);
                }
                
                fullData = await response.json();
                renderTable(fullData);
                
                statusElement.textContent = `数据加载成功! 共加载 ${fullData.length} 条知识记录。`;
                statusElement.className = "status success";
                
            } catch (error) {
                console.error('加载数据时出错:', error);
                statusElement.textContent = `错误: 无法加载data.json文件。错误详情: ${error.message}`;
                statusElement.className = "status error";
                
                // 显示示例数据（增加类别文字长度用于测试换行）
                fullData = [
                    {
                        "id": "1",
                        "topic": "HTML基础",
                        "category": "前端开发",
                        "description": "超文本标记语言，用于创建网页结构",
                        "importance": "高"
                    },
                    {
                        "id": "2",
                        "topic": "CSS选择器",
                        "category": "样式设计",
                        "description": "用于选择需要样式化的HTML元素",
                        "importance": "中"
                    },
                    {
                        "id": "3",
                        "topic": "JavaScript变量",
                        "category": "脚本编程",
                        "description": "用于存储数据的值容器",
                        "importance": "高"
                    },
                    {
                        "id": "4",
                        "topic": "响应式布局",
                        "category": "前端设计与开发",
                        "description": "适配不同设备屏幕的布局方式",
                        "importance": "高"
                    }
                ];
                renderTable(fullData);
            }
        }

        // 渲染表格
        function renderTable(data) {
            tableBody.innerHTML = '';
            
            if (data.length === 0) {
                const noDataRow = document.createElement('tr');
                noDataRow.innerHTML = `<td colspan="5" class="no-data">未找到匹配的知识记录</td>`;
                tableBody.appendChild(noDataRow);
                return;
            }
            
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.id || ''}</td>
                    <td>${item.topic || ''}</td>
                    <td>${item.category || ''}</td>
                    <td>${item.description || ''}</td>
                    <td>${item.importance || ''}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // 搜索功能
        function handleSearch() {
            const keyword = searchInput.value.trim().toLowerCase();
            
            if (!keyword) {
                renderTable(fullData);
                searchResult.style.display = 'none';
                return;
            }
            
            const filteredData = fullData.filter(item => {
                const topicMatch = item.topic?.toLowerCase().includes(keyword);
                const categoryMatch = item.category?.toLowerCase().includes(keyword);
                const descMatch = item.description?.toLowerCase().includes(keyword);
                return topicMatch || categoryMatch || descMatch;
            });
            
            renderTable(filteredData);
            
            searchResult.style.display = 'block';
            searchResult.textContent = `找到 ${filteredData.length} 条与"${keyword}"相关的记录`;
        }

        // 清除搜索
        function clearSearch() {
            searchInput.value = '';
            renderTable(fullData);
            searchResult.style.display = 'none';
        }

        // 绑定事件
        function bindEvents() {
            searchBtn.addEventListener('click', handleSearch);
            clearBtn.addEventListener('click', clearSearch);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleSearch();
            });
        }

        // 页面加载完成后执行
        window.onload = function() {
            initRefreshAlert();
            loadData();
            bindEvents();
        };
    </script>
</body>
</html>
